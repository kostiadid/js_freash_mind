<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather App</title>
  </head>

  <body>

    <button id='get-weather-btn'></button>
    <select>
      <option value=''></option>
      <option value='new york'>New York</option>
      <option value='los angeles'>Los Angeles</option>
      <option value='chicago'>Chicago</option>
      <option value='paris'>Paris</option>
      <option value='tokyo'>Tokyo</option>
      <option value='london'>London</option>
    </select>


    <div id='result'>

      <img id='weather-icon'></img>
      <span id ='main-temperature'></span>
      <span id ='feels-like'></span>
      <span id ='humidity'></span>
      <span id ='wind'></span>
      <span id ='wind-gust'></span>
      <span id ='weather-main'></span>
      <span id ='location'></span>

    </div>
    <script src='./script.js'>
   async function showWeather(city){

 let result= await getWeather(city)
  if (result === undefined) { console.log("Error") }
   else { console.log(result) 
   }
}
async function getWeather(city){

const response = await fetch(`https://weather-proxy.freecodecamp.rocks/api/city/${city}`)
  if (!response.ok) { 
    console.log("Error") 
    return undefined } 
    const data = await response.json() 
    return data }      
    </script>
    
  </body>

</html>
